[package]
name        = "freeq-gateway"
description = "FreeQ gateway relay — accepts leaf sessions and forwards between them (never dials leaves)"

version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true

[[bin]]
name = "freeq-gateway"
path = "src/main.rs"

[dependencies]
freeq-crypto    = { path = "../crates/freeq-crypto" }
freeq-transport = { path = "../crates/freeq-transport" }
freeq-tunnel    = { path = "../crates/freeq-tunnel" }
freeq-auth      = { path = "../crates/freeq-auth" }
freeq-config    = { path = "../crates/freeq-config" }

tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
clap               = { workspace = true }
rand               = { workspace = true }
base64             = { workspace = true }
bytes              = { workspace = true }
ipnetwork          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
axum               = { workspace = true }
zeroize            = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
